<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>KeyDrop</title>
    <link rel="icon" type="image/png" href="assets/icon-32.png" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header class="brand-header">
      <div class="brand">
        <img
          class="brand-mark"
          src="assets/icon-128.png"
          alt=""
          width="44"
          height="44"
        /><span>KeyDrop</span>
      </div>
    </header>
    <main>
      <section class="editor" aria-label="密钥文件">
        <fieldset id="format" aria-label="文件格式">
          <label
            ><input type="radio" name="format" value="txt" checked /><span
              >TXT</span
            ></label
          >
          <label
            ><input type="radio" name="format" value="json" /><span
              >JSON</span
            ></label
          >
          <label
            ><input type="radio" name="format" value="yaml" /><span
              >YAML</span
            ></label
          >
        </fieldset>
        <div id="rows"></div>
        <div class="actions">
          <button id="read">
            <span data-icon="clipboard"></span>读取剪贴板</button
          ><button class="primary" id="generate">
            <span data-icon="file"></span>生成并复制文件
          </button>
        </div>
        <section
          id="site-permission"
          class="site-permission"
          aria-labelledby="site-permission-title"
        >
          <div>
            <h2 id="site-permission-title">本网站快捷入口</h2>
            <p id="site-permission-state">正在读取网站权限…</p>
          </div>
          <button id="site-toggle" type="button" disabled>读取中</button>
        </section>
        <p id="status" role="status" aria-live="polite" hidden></p>
        <div id="ready" hidden>
          <div class="file-result">
            <span class="file-symbol" data-icon="file"></span>
            <div>
              <strong id="file-name">api-key.txt</strong
              ><span>文件已在剪贴板</span>
            </div>
            <span class="success-icon" data-icon="check"></span>
          </div>
          <div class="file-actions">
            <button id="copy-file">复制 api-key.txt</button
            ><a id="download" download="api-key.txt">下载副本</a
            ><span id="drag" draggable="true" title="拖入支持文件的输入框"
              >拖拽文件 <span data-icon="arrow-up-right"></span
            ></span>
          </div>
        </div>
      </section>
      <div class="utility-actions">
        <button id="cleanup-cache">
          <span data-icon="trash"></span>文件清理
        </button>
      </div>
    </main>
    <dialog
      id="confirm"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-body"
    >
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <label id="cleanup-options" hidden>
        <input id="include-downloads" type="checkbox" />
        同时清理下载副本
      </label>
      <div class="actions">
        <button id="cancel">取消</button
        ><button id="confirm-do" class="danger">确认</button>
      </div>
    </dialog>
    <template id="row-template">
      <div class="row">
        <label class="name-field"
          ><span>名称</span
          ><input
            class="name"
            aria-label="可选名称"
            autocomplete="off"
            spellcheck="false" /></label
        ><span class="colon" aria-hidden="true">:</span
        ><label class="value-field"
          ><span>API Key</span
          ><input
            class="value"
            type="password"
            aria-label="API Key"
            placeholder="粘贴你的 Key"
            autocomplete="off"
            spellcheck="false"
        /></label>
        <div class="row-tools">
          <button
            class="reveal icon"
            aria-label="显示 API Key"
            title="显示 API Key"
            aria-pressed="false"
            data-icon="eye"
          ></button
          ><button
            class="remove icon"
            aria-label="移除这一行"
            title="移除这一行"
            data-icon="minus"
          ></button
          ><button
            class="add icon"
            aria-label="添加 API Key"
            title="添加 API Key"
            data-icon="plus"
          ></button>
        </div>
      </div>
    </template>
    <script src="assets.js"></script>
    <script type="module" src="editor.js"></script>
  </body>
</html>
